<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NextGen AI Platform</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
  }

  .card {
    background: radial-gradient(ellipse at 38% 50%, #191200 0%, #0C0C0C 55%, #060606 100%);
    border-radius: 16px;
    border: 1px solid rgba(245, 196, 0, 0.2);
    padding: 38px 52px 30px 52px;
    position: relative;
    overflow: hidden;
    width: 560px;
  }

  /* top gold fade bar */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2.5px;
    background: linear-gradient(90deg, transparent, #F5C400 30%, #FFE566 50%, #F5C400 70%, transparent);
    border-radius: 16px 16px 0 0;
  }

  .wordmark {
    display: flex;
    align-items: baseline;
    line-height: 1;
    position: relative;
  }

  .N-wrap {
    position: relative;
    display: inline-block;
  }

  .N {
    font-size: 112px;
    font-weight: 900;
    background: linear-gradient(175deg, #FFE566 0%, #D4A000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
    line-height: 1;
    margin-right: -3px;
  }

  /* Pulse dot */
  .pulse-wrap {
    position: absolute;
    top: 6px;
    right: -4px;
    width: 14px;
    height: 14px;
  }

  .pulse-core {
    width: 14px;
    height: 14px;
    background: #FFE566;
    border-radius: 50%;
    position: absolute;
    top: 0; left: 0;
    box-shadow: 0 0 8px rgba(245,196,0,0.9);
  }

  .pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1.8px solid #F5C400;
    border-radius: 50%;
    width: 14px; height: 14px;
    animation: pulseRing 2.2s ease-out infinite;
  }

  .pulse-ring:nth-child(2) { animation-delay: 0.75s; }
  .pulse-ring:nth-child(3) { animation-delay: 1.5s; }

  @keyframes pulseRing {
    0%   { width: 14px; height: 14px; opacity: 0.85; }
    100% { width: 64px; height: 64px; opacity: 0; }
  }

  .ext {
    font-size: 90px;
    font-weight: 900;
    color: #F0F0F0;
    letter-spacing: -3px;
    line-height: 1;
  }

  .gen {
    font-size: 90px;
    font-weight: 900;
    background: linear-gradient(175deg, #FFE566 0%, #D4A000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -3px;
    line-height: 1;
  }

  .divider {
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(245,196,0,0.4) 20%, rgba(245,196,0,0.4) 80%, transparent);
    margin: 10px 0 10px;
    border-radius: 1px;
  }

  .sub {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 12px;
    color: #555;
    letter-spacing: 7px;
    text-align: left;
  }

  /* corner node cluster bottom-left */
  .nodes {
    position: absolute;
    bottom: 22px;
    left: 28px;
  }

  /* corner accent top-right */
  .corner-tr {
    position: absolute;
    top: 14px; right: 14px;
    width: 18px; height: 18px;
    border-top: 1.5px solid rgba(245,196,0,0.35);
    border-right: 1.5px solid rgba(245,196,0,0.35);
    border-radius: 0 4px 0 0;
  }
  .corner-bl {
    position: absolute;
    bottom: 14px; left: 14px;
    width: 18px; height: 18px;
    border-bottom: 1.5px solid rgba(245,196,0,0.35);
    border-left: 1.5px solid rgba(245,196,0,0.35);
    border-radius: 0 0 0 4px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>

  <div class="wordmark">
    <div class="N-wrap">
      <span class="N">N</span>
      <div class="pulse-wrap">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-core"></div>
      </div>
    </div>
    <span class="ext">ext</span><span class="gen">Gen</span>
  </div>

  <div class="divider"></div>
  <div class="sub">AI PLATFORM</div>
</div>

</body>
</html>
